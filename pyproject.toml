[project]
name = "hearsay"
version = "0.2.0"
description = "crawl4ai for video & audio — turn any YouTube video, podcast episode, or local recording into clean, timestamped, LLM-ready markdown"
readme = "README.md"
authors = [
    { name = "Mudassar Awan", email = "mudassar.awan@snapdev.ai" }
]
maintainers = [
    { name = "Mudassar Awan", email = "mudassar.awan@snapdev.ai" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "transcription",
    "whisper",
    "parakeet",
    "mlx",
    "youtube",
    "podcast",
    "speech-to-text",
    "subtitles",
    "markdown",
    "rag",
    "llm",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Environment :: Console",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.12",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.6.9",
]

[project.urls]
Homepage = "https://github.com/mudassar531/hearsay"
Repository = "https://github.com/mudassar531/hearsay"
Issues = "https://github.com/mudassar531/hearsay/issues"

[project.scripts]
hearsay = "hearsay.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
# Fast Apple-Silicon transcription engine (NVIDIA Parakeet on MLX). macOS arm64
# only; on other platforms hearsay falls back to CPU Whisper automatically.
parakeet = [
    "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=1.2",
    "mypy>=2.1.0",
    "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# These characters are intentional typography: the en dash appears in
# time-span section titles, and the curly quotes are matched literally in
# the grouping module's punctuation regexes (transcripts contain them).
allowed-confusables = ["–", "“", "”", "‘", "’"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# webui.py embeds a single-page HTML/CSS/JS asset as a string literal; line
# length is meaningless there.
"src/hearsay/webui.py" = ["E501"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
# Lenient policy: no strict mode; untyped third-party deps get scoped
# [[tool.mypy.overrides]] entries instead of a global ignore_missing_imports,
# so first-party import typos still fail.

[[tool.mypy.overrides]]
# These third-party deps ship no type stubs or py.typed marker.
module = ["faster_whisper.*", "feedparser.*", "parakeet_mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
